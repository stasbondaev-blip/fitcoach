<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FitCoach</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  background:#000;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  font-weight:400;
  letter-spacing:-0.02em;
  min-height:100vh;
  padding-bottom:90px;
  overflow-x:hidden;
}
h1 {
  font-size:34px;
  font-weight:700;
  letter-spacing:-0.03em;
  margin:24px 20px 8px;
}
.subtitle {
  font-size:15px;
  color:#86868b;
  margin:0 20px 28px;
  font-weight:400;
}
.section {
  padding:0 20px;
  margin-bottom:16px;
}
.card {
  background:#1c1c1e;
  border-radius:18px;
  padding:22px;
  border:1px solid rgba(255,255,255,0.06);
}
.card h2 {
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:#86868b;
  font-weight:600;
  margin-bottom:14px;
}
.card p {
  font-size:17px;
  line-height:1.45;
  color:#f5f5f7;
}
.btn {
  width:100%;
  background:#e10600;
  color:#fff;
  border:none;
  padding:16px;
  border-radius:14px;
  font-size:17px;
  font-weight:600;
  letter-spacing:-0.01em;
  cursor:pointer;
  margin-top:16px;
  transition:opacity 0.2s ease;
}
.btn:active { opacity:0.7; }
.btn.secondary {
  background:transparent;
  border:1px solid rgba(255,255,255,0.15);
  color:#f5f5f7;
}
.btn.green { background:#30d158; }
.big-number {
  font-size:64px;
  font-weight:700;
  letter-spacing:-0.04em;
  color:#f5f5f7;
  line-height:1;
}
.big-number.accent { color:#e10600; }
.label {
  font-size:13px;
  color:#86868b;
  text-transform:uppercase;
  letter-spacing:0.08em;
  margin-top:8px;
  font-weight:600;
}
.exercise {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 0;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.exercise:last-child { border-bottom:none; }
.exercise-name { font-size:17px; font-weight:500; }
.exercise-detail { font-size:15px; color:#86868b; font-weight:400; font-variant-numeric:tabular-nums; }
.nav {
  position:fixed;
  bottom:0; left:0; right:0;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,0.08);
  display:flex;
  justify-content:space-around;
  padding:10px 0 22px;
  z-index:100;
}
.nav-btn {
  background:none; border:none;
  color:#86868b;
  font-size:10px;
  font-weight:500;
  letter-spacing:0.02em;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  cursor:pointer;
  padding:4px 16px;
  transition:color 0.2s ease;
}
.nav-btn.active { color:#f5f5f7; }
.nav-icon { font-size:22px; line-height:1; }
.tab { display:none; animation:fadeIn 0.25s ease; }
.tab.active { display:block; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.divider {
  height:1px;
  background:rgba(255,255,255,0.08);
  margin:20px 20px;
}
.stat-row {
  display:flex;
  justify-content:space-between;
  padding:16px 0;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.stat-row:last-child { border-bottom:none; }
.stat-row .label { margin:0; }
.loader {
  width:32px; height:32px;
  border:2px solid rgba(255,255,255,0.1);
  border-top-color:#e10600;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin:30px auto;
}
@keyframes spin { to{transform:rotate(360deg)} }
.center { text-align:center; }
.hidden { display:none !important; }
.breath-circle {
  width:200px; height:200px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #ff3b30, #e10600);
  margin:40px auto;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:500;
  color:#fff;
  transition:transform 4s cubic-bezier(0.4,0,0.2,1), opacity 4s ease;
  box-shadow:0 0 60px rgba(225,6,0,0.3);
}
.breath-circle.inhale { transform:scale(1.4); opacity:0.85; }
.breath-circle.hold { transform:scale(1.4); opacity:0.7; }
.breath-circle.exhale { transform:scale(1); opacity:1; }
</style>
</head>
<body>

<!-- Вкладка: Тренировка -->
<div id="tab-workout" class="tab active">
  <h1>Тренировка</h1>
  <p class="subtitle">Персональная программа на сегодня</p>

  <div id="intro" class="section">
    <div class="card">
      <h2>Статус</h2>
      <p>Готов начать. ИИ подберёт нагрузку под твой профиль.</p>
      <button class="btn" onclick="generate()">Создать программу</button>
    </div>
  </div>

  <div id="loader" class="section hidden">
    <div class="loader"></div>
    <p class="center" style="color:#86868b;font-size:15px;">Генерация программы...</p>
  </div>

  <div id="program" class="section hidden">
    <div class="card">
      <h2>Программа</h2>
      <div id="exerciseList"></div>
    </div>
    <button class="btn green" onclick="finish()">Завершить тренировку</button>
  </div>
</div>

<!-- Вкладка: Дыхание -->
<div id="tab-breath" class="tab">
  <h1>Дыхание</h1>
  <p class="subtitle">Техника 4-7-8 для восстановления</p>
  <div class="section">
    <div class="breath-circle" id="breathCircle">Старт</div>
    <button class="btn" onclick="startBreath()">Начать</button>
  </div>
</div>

<!-- Вкладка: Прогресс -->
<div id="tab-stats" class="tab">
  <h1>Прогресс</h1>
  <p class="subtitle">Твоя статистика</p>
  <div class="section">
    <div class="card">
      <div class="big-number accent" id="streakNum">0</div>
      <div class="label">Дней подряд</div>
    </div>
  </div>
  <div class="section">
    <div class="card">
      <div class="big-number" id="totalNum">0</div>
      <div class="label">Всего тренировок</div>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="switchTab('workout',this)">
    <span class="nav-icon">◉</span><span>Тренировка</span>
  </button>
  <button class="nav-btn" onclick="switchTab('breath',this)">
    <span class="nav-icon">○</span><span>Дыхание</span>
  </button>
  <button class="nav-btn" onclick="switchTab('stats',this)">
    <span class="nav-icon">▤</span><span>Прогресс</span>
  </button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

function haptic(type){ try{ tg.HapticFeedback.impactOccurred(type||'light'); }catch(e){} }

function switchTab(id, btn){
  haptic('light');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
}

const exercises = [
  {name:'Разминка', detail:'5 мин'},
  {name:'Приседания', detail:'3 × 15'},
  {name:'Отжимания', detail:'3 × 12'},
  {name:'Планка', detail:'3 × 45 сек'},
  {name:'Заминка', detail:'5 мин'}
];

function generate(){
  haptic('medium');
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('loader').classList.remove('hidden');
  setTimeout(()=>{
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('program').classList.remove('hidden');
    const list = document.getElementById('exerciseList');
    list.innerHTML = exercises.map(e=>`
      <div class="exercise">
        <div class="exercise-name">${e.name}</div>
        <div class="exercise-detail">${e.detail}</div>
      </div>
    `).join('');
    haptic('success');
  }, 1200);
}

function finish(){
  haptic('success');
  tg.sendData('workout_completed');
}

function startBreath(){
  haptic('medium');
  const c = document.getElementById('breathCircle');
  const steps = [
    {text:'Вдох', cls:'inhale', d:4000},
    {text:'Задержка', cls:'hold', d:7000},
    {text:'Выдох', cls:'exhale', d:8000}
  ];
  let i=0;
  function next(){
    const s=steps[i];
    c.innerText=s.text;
    c.className='breath-circle '+s.cls;
    i=(i+1)%steps.length;
    setTimeout(next,s.d);
  }
  next();
}
</script>
</body>
</html>
