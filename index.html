<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitCoach AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
        }
        h1 { text-align: center; margin-bottom: 30px; font-size: 28px; }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-main {
            width: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .nav-btn {
            background: none; border: none; color: rgba(255,255,255,0.5);
            font-size: 12px; display: flex; flex-direction: column; align-items: center;
        }
        .nav-btn.active { color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🤖 FitCoach AI</h1>
    
    <div class="card">
        <h2>Готов к тренировке?</h2>
        <p style="margin: 10px 0; opacity: 0.8;">Нажми кнопку ниже, чтобы ИИ создал программу.</p>
        <button class="btn-main" onclick="generateWorkout()">✨ Создать программу</button>
    </div>

    <div id="result" class="card" style="display: none;">
        <h2>🔥 Твоя программа:</h2>
        <p style="margin-top: 10px;">1. Разминка (5 мин)</p>
        <p>2. Приседания (3 подхода по 15 раз)</p>
        <p>3. Отжимания (3 подхода по 12 раз)</p>
        <button class="btn-main" style="background: #2ecc71; margin-top: 15px;" onclick="finishWorkout()">✅ Завершить и сохранить</button>
    </div>

    <div class="nav">
        <button class="nav-btn active"><span>🏋️</span><span>Тренировка</span></button>
        <button class="nav-btn"><span>🧘</span><span>Дыхание</span></button>
        <button class="nav-btn"><span>📊</span><span>Прогресс</span></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function generateWorkout() {
            document.getElementById('result').style.display = 'block';
        }

        function finishWorkout() {
            tg.sendData('workout_completed');
        }
    </script>
</body>
</html>
