<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анимации упражнений</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;padding:20px}
h1{text-align:center;margin-bottom:30px;color:#e10600}
.exercise{background:#1c1c1e;border-radius:18px;padding:20px;margin-bottom:20px;border:1px solid rgba(255,255,255,.1)}
.exercise h2{font-size:18px;margin-bottom:15px;color:#f5f5f7}
.anim-container{background:#000;border-radius:14px;height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.anim-container svg{height:200px;width:auto}
</style>
</head>
<body>

<h1>🏋️ Правильные анимации</h1>

<div class="exercise">
  <h2>1. Приседания</h2>
  <div class="anim-container">
    <svg viewBox="0 0 100 160">
      <!-- Голова -->
      <circle cx="50" cy="20" r="10" fill="#e10600" stroke="#fff" stroke-width="2"/>
      <!-- Торс (наклоняется при приседе) -->
      <g>
        <line x1="50" y1="30" x2="50" y2="70" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="0 50 70; -15 50 70; 0 50 70" dur="2.5s" repeatCount="indefinite"/>
      </g>
      <!-- Руки -->
      <line x1="50" y1="40" x2="30" y2="55" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="40" x2="70" y2="55" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <!-- Бёдра (опускаются) -->
      <g>
        <line x1="50" y1="70" x2="35" y2="100" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <line x1="50" y1="70" x2="65" y2="100" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 20; 0 0" dur="2.5s" repeatCount="indefinite"/>
      </g>
      <!-- Голени (сгибаются в коленях) -->
      <g>
        <line x1="35" y1="100" x2="30" y2="140" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <line x1="65" y1="100" x2="70" y2="140" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 5 20; 0 0" dur="2.5s" repeatCount="indefinite"/>
      </g>
      <!-- Суставы -->
      <circle cx="50" cy="70" r="4" fill="#e10600"/>
      <circle cx="35" cy="100" r="4" fill="#e10600"/>
      <circle cx="65" cy="100" r="4" fill="#e10600"/>
    </svg>
  </div>
</div>

<div class="exercise">
  <h2>2. Отжимания</h2>
  <div class="anim-container">
    <svg viewBox="0 0 120 80">
      <!-- Голова -->
      <circle cx="20" cy="25" r="8" fill="#e10600" stroke="#fff" stroke-width="2"/>
      <!-- Корпус (опускается) -->
      <g>
        <line x1="25" y1="30" x2="95" y2="30" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 15; 0 0" dur="2s" repeatCount="indefinite"/>
      </g>
      <!-- Руки (сгибаются в локтях) -->
      <g>
        <line x1="35" y1="30" x2="35" y2="55" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <line x1="85" y1="30" x2="85" y2="55" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 15; 0 0" dur="2s" repeatCount="indefinite"/>
      </g>
      <!-- Ноги (статичны) -->
      <line x1="95" y1="30" x2="110" y2="55" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <!-- Суставы -->
      <circle cx="35" cy="30" r="3" fill="#e10600"/>
      <circle cx="85" cy="30" r="3" fill="#e10600"/>
      <circle cx="35" cy="55" r="3" fill="#e10600"/>
      <circle cx="85" cy="55" r="3" fill="#e10600"/>
    </svg>
  </div>
</div>

<div class="exercise">
  <h2>3. Планка</h2>
  <div class="anim-container">
    <svg viewBox="0 0 120 80">
      <!-- Голова -->
      <circle cx="15" cy="20" r="8" fill="#e10600" stroke="#fff" stroke-width="2"/>
      <!-- Корпус (лёгкое покачивание) -->
      <g>
        <line x1="20" y1="25" x2="100" y2="25" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="0 60 25; 2 60 25; 0 60 25; -2 60 25; 0 60 25" dur="3s" repeatCount="indefinite"/>
      </g>
      <!-- Руки (упор на локтях) -->
      <line x1="25" y1="25" x2="25" y2="50" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="95" y1="25" x2="95" y2="50" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <!-- Ноги -->
      <line x1="100" y1="25" x2="110" y2="50" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <!-- Суставы -->
      <circle cx="25" cy="25" r="3" fill="#e10600"/>
      <circle cx="95" cy="25" r="3" fill="#e10600"/>
      <circle cx="25" cy="50" r="3" fill="#e10600"/>
      <circle cx="95" cy="50" r="3" fill="#e10600"/>
    </svg>
  </div>
</div>

<div class="exercise">
  <h2>4. Выпады</h2>
  <div class="anim-container">
    <svg viewBox="0 0 100 160">
      <!-- Голова -->
      <circle cx="50" cy="20" r="10" fill="#e10600" stroke="#fff" stroke-width="2"/>
      <!-- Торс -->
      <line x1="50" y1="30" x2="50" y2="70" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <!-- Руки -->
      <line x1="50" y1="40" x2="30" y2="55" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="40" x2="70" y2="55" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <!-- Передняя нога (выпад вперёд) -->
      <g>
        <line x1="50" y1="70" x2="30" y2="100" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <line x1="30" y1="100" x2="25" y2="140" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 15 20; 0 0" dur="2.5s" repeatCount="indefinite"/>
      </g>
      <!-- Задняя нога (отводится назад) -->
      <g>
        <line x1="50" y1="70" x2="70" y2="100" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <line x1="70" y1="100" x2="75" y2="140" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -10 10; 0 0" dur="2.5s" repeatCount="indefinite"/>
      </g>
      <!-- Суставы -->
      <circle cx="50" cy="70" r="4" fill="#e10600"/>
      <circle cx="30" cy="100" r="4" fill="#e10600"/>
      <circle cx="70" cy="100" r="4" fill="#e10600"/>
    </svg>
  </div>
</div>

<div class="exercise">
  <h2>5. Скручивания (пресс)</h2>
  <div class="anim-container">
    <svg viewBox="0 0 100 80">
      <!-- Ноги (согнуты, статичны) -->
      <line x1="70" y1="60" x2="85" y2="50" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <line x1="85" y1="50" x2="90" y2="60" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <!-- Таз (статичен) -->
      <line x1="50" y1="60" x2="70" y2="60" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <!-- Верхняя часть корпуса (поднимается) -->
      <g>
        <line x1="50" y1="60" x2="30" y2="40" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <line x1="30" y1="40" x2="20" y2="30" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="20" cy="25" r="8" fill="#e10600" stroke="#fff" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate" values="0 50 60; -30 50 60; 0 50 60" dur="2s" repeatCount="indefinite"/>
      </g>
      <!-- Суставы -->
      <circle cx="50" cy="60" r="3" fill="#e10600"/>
      <circle cx="70" cy="60" r="3" fill="#e10600"/>
    </svg>
  </div>
</div>

</body>
</html>
